name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm + Node
        uses: pnpm/setup@v3
        with:
          version: 12.6.0
          runtime: node@26.10.0
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - name: Rust format
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy \
          --manifest-path apps/desktop/src-tauri/Cargo.toml \
          --all-targets \
          --all-features \
          -- \
          -D warnings
