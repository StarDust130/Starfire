name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm + Node
        uses: pnpm/setup@v3
        with:
          version: 12.6.0
          runtime: node@26.10.0
          cache: true
          install: false
          require-lockfile: true

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🔷 TypeScript checks
        run: pnpm check